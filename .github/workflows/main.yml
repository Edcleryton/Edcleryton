name: GitHub Stats and Metrics
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # CARD 1: Estatísticas Gerais (Estilo image_2bc99a.png)
      - name: GitHub Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=edcleryton&show_icons=true&theme=gruvbox&include_all_commits=true&hide_rank=false
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # CARD 2: Linguagens das Star Lists (Estilo image_2c1f77.png)
      - name: Star Lists Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: edcleryton
          filename: github-metrics.svg
          base: "" # Remove o cabeçalho para focar apenas na lista
          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists_limit: 1
          plugin_languages: no # Desativa as linguagens globais para focar apenas nas listas
