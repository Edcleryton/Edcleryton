name: GitHub Stats and Metrics
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Resolve a depreciação do Node.js 20

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Estatísticas de Impacto (Focado em Commits e Atividade Real)
      - name: GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=edcleryton&show_icons=true&theme=gruvbox&include_all_commits=true&count_weight=0.5
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Métricas de Engenharia (Foco em JS, TS, Python e Habits)
      - name: Advanced Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: edcleryton
          filename: github-metrics.svg
          base: header, repositories
          config_timezone: America/Bahia
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, roff # Filtra o que não é automação/lógica
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_lines: yes # Exibe o volume de código gerenciado
