name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Estágio 1: Gera as estatísticas que substituem o readme-stats
      - name: GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: edcleryton
          filename: github-stats.svg
          base: header, repositories
          plugin_isocalendar: yes
          plugin_languages: yes

      # Estágio 2: Gera as métricas avançadas
      - name: Advanced Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: edcleryton
          filename: github-metrics.svg
          base: activity, community, metadata
          config_timezone: America/Bahia
