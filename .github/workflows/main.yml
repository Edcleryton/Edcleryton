name: GitHub Stats and Metrics
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Imagem 1: Estatísticas Gerais (Estilo das imagens escuras/coloridas)
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=edcleryton&show_icons=true&theme=radical&include_all_commits=true
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Imagem 2: Apenas as Linguagens das Star Lists (Sem foto, sem cabeçalho)
      - name: Generate Star Lists Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: edcleryton
          filename: github-metrics.svg
          base: "" # O segredo está aqui: o valor vazio remove o cabeçalho com sua foto e bio
          plugin_starlists: yes
          plugin_starlists_languages: yes

      # Salva os dois arquivos limpos no repositório
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.svg
          git commit -m "QA Fix: Isolar Stats e Star Lists" || exit 0
          git push
