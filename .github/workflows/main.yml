name: GitHub Stats Card
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Gera apenas o cartão de estatísticas com o tema escolhido
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=edcleryton&show_icons=true&theme=radical&include_all_commits=true
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Grava o ficheiro no repositório
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add github-stats.svg
          git commit -m "QA Fix: Isolar apenas o Stats Card" || exit 0
          git push
